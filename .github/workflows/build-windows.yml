name: Build Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          cmake --build build -j$(nproc)

      - name: Package Windows Release
        run: |
          mkdir -p dist
          cp build/haxball_client.exe dist/
          cp -r assets dist/
          ldd build/haxball_client.exe | grep -i '/mingw64/bin/' | awk '{print $3}' | while read -r dll; do
            [ -n "$dll" ] && cp -v "$dll" dist/
          done
          powershell.exe -NoProfile -Command "Compress-Archive -Path dist/* -DestinationPath HaxballCPP-Windows.zip -Force"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HaxballCPP-Windows
          path: HaxballCPP-Windows.zip

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Windows Build
          body: "Automatically compiled Windows release (`haxball_client.exe` + DLLs + `assets/`). Unzip and run `haxball_client.exe`."
          files: HaxballCPP-Windows.zip
          make_latest: true
